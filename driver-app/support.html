<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Tickets</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="support-app">
        <!-- Status Bar -->
        <div class="status-bar-dark">
            <div class="time">9:41</div>
            <div class="status-icons">
                <!-- Cellular Signal -->
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="7.2" width="3" height="4.8" fill="#262D36"/>
                    <rect x="5" y="4.8" width="3" height="7.2" fill="#262D36"/>
                    <rect x="10" y="2.4" width="3" height="9.6" fill="#262D36"/>
                    <rect x="15" y="0" width="3" height="12" fill="#262D36"/>
                </svg>
                <!-- Wifi -->
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 11.625L15.6528 2.05315C11.5036 -1.16335 4.54926 -0.638575 0.347168 2.05315L8 11.625Z" fill="#262D36"/>
                </svg>
                <!-- Battery -->
                <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="20" height="10" rx="2" stroke="#262D36" stroke-width="1" stroke-opacity="0.4"/>
                    <rect x="2" y="2" width="15" height="8" rx="1" fill="#262D36"/>
                    <path d="M23 4V8" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
                </svg>
            </div>
        </div>

        <!-- Header Content -->
        <div class="support-header">
            <button class="back-btn" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="support-title">Support Tickets</h1>
            <button class="edit-btn" onclick="document.getElementById('createModal').style.display='flex'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11 4H4C3.46957 4 2.96086 4.21071 2.58579 4.58579C2.21071 4.96086 2 5.46957 2 6V20C2 20.5304 2.21071 21.0391 2.58579 21.4142C2.96086 21.7893 3.46957 22 4 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V13" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18.5 2.5C18.8978 2.10217 19.4374 1.87868 20 1.87868C20.5626 1.87868 21.1022 2.10217 21.5 2.5C21.8978 2.89782 22.1213 3.43739 22.1213 4C22.1213 4.56261 21.8978 5.10217 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <!-- Content Area -->
        <div id="content-area">
            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="#DA0707" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="empty-state-text">No tickets found</span>
            </div>
            <!-- Ticket List -->
            <div id="ticket-list" style="display: none; padding: 16px;"></div>
        </div>

        <!-- Create Ticket Modal -->
        <div id="createModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create Support Ticket</h2>
                    <button onclick="document.getElementById('createModal').style.display='none'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Issue Type</label>
                        <select id="ticketType">
                            <option value="safety">Safety Issue</option>
                            <option value="payment">Payment Issue</option>
                            <option value="driver_behavior">Driver Behavior</option>
                            <option value="vehicle_condition">Vehicle Condition</option>
                            <option value="route_issue">Route Issue</option>
                            <option value="fare_dispute">Fare Dispute</option>
                            <option value="app_issue">App Issue</option>
                            <option value="other" selected>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="ticketSubject" placeholder="Brief subject of the issue">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="ticketDescription" rows="4" placeholder="Provide details about your issue..."></textarea>
                    </div>
                    <button class="submit-btn" onclick="submitTicket()">Submit Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api'; // Adjust to your actual backend URL

        async function fetchTickets() {
            try {
                const token = localStorage.getItem('token');
                if (!token) return;

                const response = await fetch(`${API_URL}/drivers/complaints`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const tickets = await response.json();
                    renderTickets(tickets);
                }
            } catch (error) {
                console.error('Error fetching tickets:', error);
            }
        }

        function renderTickets(tickets) {
            const emptyState = document.getElementById('empty-state');
            const ticketList = document.getElementById('ticket-list');

            if (tickets.length === 0) {
                emptyState.style.display = 'flex';
                ticketList.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                ticketList.style.display = 'block';
                
                ticketList.innerHTML = tickets.map(ticket => `
                    <div class="ticket-card">
                        <div class="ticket-card-header">
                            <span class="ticket-subject">${ticket.subject}</span>
                            <span class="ticket-status status-${ticket.status}">${ticket.status.toUpperCase()}</span>
                        </div>
                        <div class="ticket-type">${ticket.type.replace('_', ' ')}</div>
                        <div class="ticket-date">${new Date(ticket.createdAt).toLocaleDateString()}</div>
                    </div>
                `).join('');
            }
        }

        async function submitTicket() {
            const type = document.getElementById('ticketType').value;
            const subject = document.getElementById('ticketSubject').value;
            const description = document.getElementById('ticketDescription').value;

            if (!subject || !description) {
                alert('Please provide subject and description');
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/drivers/complaints`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ type, subject, description })
                });

                if (response.ok) {
                    alert('Ticket submitted successfully');
                    document.getElementById('createModal').style.display = 'none';
                    document.getElementById('ticketSubject').value = '';
                    document.getElementById('ticketDescription').value = '';
                    document.getElementById('ticketType').value = 'other';
                    fetchTickets();
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error submitting ticket');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting ticket');
            }
        }

        // Initial fetch
        fetchTickets();
    </script>
</body>
</html>
