<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Wallet</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wallet-app">
        <!-- Blue Header Background -->
        <div class="header-background"></div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="7.2" width="3" height="4.8" fill="white"/>
                    <rect x="5" y="4.8" width="3" height="7.2" fill="white"/>
                    <rect x="10" y="2.4" width="3" height="9.6" fill="white"/>
                    <rect x="15" y="0" width="3" height="12" fill="white"/>
                </svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 11.625L15.6528 2.05315C11.5036 -1.16335 4.54926 -0.638575 0.347168 2.05315L8 11.625Z" fill="white"/>
                </svg>
                <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="20" height="10" rx="2" stroke="white" stroke-width="1" stroke-opacity="0.4"/>
                    <rect x="2" y="2" width="15" height="8" rx="1" fill="white"/>
                    <path d="M23 4V8" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
                </svg>
            </div>
        </div>

        <div class="scroll-content">
            <!-- Header Content -->
            <div class="header-content">
                <div class="header-top-row">
                    <button class="circle-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="circle-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 17L17 7M17 7H7M17 7V17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                
                <div class="earnings-info">
                    <div class="earnings-label">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 7V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7C3 5.89543 3.89543 5 5 5H19C20.1046 5 21 5.89543 21 7Z" stroke="#C8CCD0" stroke-width="1.5"/>
                            <path d="M16 9V11" stroke="#C8CCD0" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Earnings: 29 June - 5 Jul
                    </div>
                    <div class="earnings-amount">₹2,200</div>
                </div>
            </div>

            <!-- Overlapping Balance Card -->
            <div class="balance-card">
                <div class="balance-row">
                    <span class="balance-label">Pocket Balance</span>
                    <span class="balance-value">₹12</span>
                </div>
                <div class="balance-row">
                    <span class="balance-label">Available limit</span>
                    <span class="balance-value">₹500</span>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-outline">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 17L17 7M17 7H7M17 7V17" stroke="#0053B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Withdraw
                    </button>
                    <button class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Add Money
                    </button>
                </div>
            </div>

            <!-- Customer Tips Card -->
            <div class="tips-card">
                <div class="tips-left">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#262D36" stroke-width="1.5"/>
                        <path d="M8 12L11 15L16 9" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Customer tips balance</span>
                </div>
                <div class="tips-right">
                    <span class="tips-amount">₹0</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#262D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- Divider -->
            <div class="divider-section">
                <div class="divider-line"></div>
                <span class="divider-text">More Services</span>
                <div class="divider-line"></div>
            </div>

            <!-- Services Grid -->
            <div class="services-grid">
                <div class="service-card">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#262D36" stroke-width="1.5"/>
                        <path d="M12 8V16M8 12H16" stroke="#262D36" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <div class="service-name">Payout</div>
                    <div class="service-date">22 Jun - 28 June</div>
                </div>
                <div class="service-card">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#262D36" stroke-width="1.5"/>
                        <path d="M8 12H16" stroke="#262D36" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <div class="service-name">Deduction<br>Satement</div>
                    <div class="service-date">22 Jun - 28 June</div>
                </div>
                <div class="service-card">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#262D36" stroke-width="1.5"/>
                        <path d="M8 12L11 15L16 9" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="service-name">Customer tips<br>Satement</div>
                </div>
            </div>
            
            <!-- Padding for bottom nav -->
            <div style="height: 100px;"></div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="#8F98A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 21H16M12 17V21M7 4H17C18.1046 4 19 4.89543 19 6V14C19 15.1046 18.1046 16 17 16H7C5.89543 16 5 15.1046 5 14V6C5 4.89543 5.89543 4 7 4Z" stroke="#9098A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 9L15 9" stroke="#9098A2" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 7V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7C3 5.89543 3.89543 5 5 5H19C20.1046 5 21 5.89543 21 7Z" stroke="white" stroke-width="1.5"/>
                    <path d="M16 9V11" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Wallet</span>
            </button>
            <button class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#9098A2" stroke-width="1.5"/>
                    <path d="M12 6V12L16 14" stroke="#9098A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </nav>
    </div>
</body>
</html>
