<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help Centre</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="help-app">
        <!-- Status Bar -->
        <div class="status-bar-dark">
            <div class="time">9:41</div>
            <div class="status-icons">
                <!-- Cellular Signal -->
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="7.2" width="3" height="4.8" fill="#262D36"/>
                    <rect x="5" y="4.8" width="3" height="7.2" fill="#262D36"/>
                    <rect x="10" y="2.4" width="3" height="9.6" fill="#262D36"/>
                    <rect x="15" y="0" width="3" height="12" fill="#262D36"/>
                </svg>
                <!-- Wifi -->
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 11.625L15.6528 2.05315C11.5036 -1.16335 4.54926 -0.638575 0.347168 2.05315L8 11.625Z" fill="#262D36"/>
                </svg>
                <!-- Battery -->
                <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="20" height="10" rx="2" stroke="#262D36" stroke-width="1" stroke-opacity="0.4"/>
                    <rect x="2" y="2" width="15" height="8" rx="1" fill="#262D36"/>
                    <path d="M23 4V8" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
                </svg>
            </div>
        </div>

        <!-- Header Content -->
        <div class="help-header">
            <button class="back-btn" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="help-title">Help Centre</h1>
        </div>

        <!-- Options Card -->
        <div class="help-card">
            <div class="help-option">
                <span>Update Bank Details</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="help-option">
                <span>Change Vehicle Type</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="help-option">
                <span>Payout Issues</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="help-option">
                <span>About Insurance Policy</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="#262D36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
